<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Coding Agent</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

</head>

<body>

<div class="container">

<header>
Mini Coding Agent (BETA)
</header>

<div id="chat"></div>

<div class="optional-repo">
    <input type="text" id="repo" placeholder="owner/repo">
    <input type="text" id="file_paths" placeholder="path/to/file.py">
</div>

<div class="input-area">
    <textarea id="prompt" placeholder="Ask something..."></textarea>
    <button id="sendBtn" onclick="sendPrompt()">Send</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");
const sessionId = "session_" + Math.random().toString(36).substring(2, 9);
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, cls, isBot = false){
    const div = document.createElement("div");
    div.className = "message " + cls;

    if (isBot && typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
        div.innerHTML = DOMPurify.sanitize(marked.parse(text));
    } else {
        div.textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendPrompt(){
    const textarea = document.getElementById("prompt");
    const prompt = textarea.value.trim();
    const repo = document.getElementById("repo").value.trim();
    const file_paths = document.getElementById("file_paths").value.trim();

    if(prompt==="") return;

    addMessage(prompt,"user");
    textarea.value="";

    const loading = addMessage("Thinking...","bot",true);
    sendBtn.disabled = true;

    let fullContent = "";
    let prUrl = null;

    try {
        const response = await fetch("/chat", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                session_id: sessionId,
                prompt: prompt,
                repo: repo || null,
                file_paths: file_paths || null
            })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            buffer += decoder.decode(value, { stream: true });
            
            let lines = buffer.split("\n\n");
            buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                
                const dataStr = line.substring(6);
                if (dataStr === "[DONE]") {
                    continue;
                }

                try {
                    const data = JSON.parse(dataStr);
                    
                    if (data.error) {
                        loading.textContent = "Error: " + data.error;
                        return;
                    }
                    
                    if (data.chunk) {
                        fullContent += data.chunk;
                        loading.textContent = fullContent;
                        chat.scrollTop = chat.scrollHeight;
                    }
                    
                    if (data.content !== undefined) {
                        fullContent = data.content;
                        if (data.pr_url) {
                            prUrl = data.pr_url;
                        }
                    }
                } catch (e) {
                    console.error("Parse error:", e, dataStr);
                }
            }
        }

        let displayText = fullContent;
        if (prUrl) {
            displayText += `\n\n---\n**PR created:** [${prUrl}](${prUrl})`;
        }

        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
            loading.innerHTML = DOMPurify.sanitize(marked.parse(displayText));
        } else {
            loading.textContent = displayText;
        }

    } catch(err){
        console.error("Fetch Error:", err);
        loading.textContent="Error contacting backend.";
    } finally {
        sendBtn.disabled = false;
    }
}

</script>

</body>
</html>
