<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Coding Agent</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

</head>

<body>

<div class="container">

<header>
Mini Coding Agent (BETA)
</header>

<div id="chat"></div>

<div class="optional-repo">
    <input type="text" id="repo" placeholder="owner/repo">
    <input type="text" id="file_paths" placeholder="path/to/file.py">
</div>

<div class="input-area">
    <textarea id="prompt" placeholder="Ask something..."></textarea>
    <button onclick="sendPrompt()">Send</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");
const sessionId = "session_" + Math.random().toString(36).substring(2, 9);

function addMessage(text, cls, isBot = false){

    const div = document.createElement("div");
    div.className = "message " + cls;

    if (isBot && typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
        div.innerHTML = DOMPurify.sanitize(marked.parse(text));
    } else {
        div.textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendPrompt(){

    const textarea = document.getElementById("prompt");
    const prompt = textarea.value.trim();
    const repo = document.getElementById("repo").value.trim();
    const file_paths = document.getElementById("file_paths").value.trim();


    if(prompt==="") return;

    addMessage(prompt,"user");

    textarea.value="";

    const loading = addMessage("Thinking...","bot",true);

    try{

        const response = await fetch("/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                session_id: sessionId,
                prompt: prompt,
                repo: repo || null,
                file_paths: file_paths || null
            })

        });

        const data = await response.json();

        let displayText = data.content;

        if (data.pr_url) {
            displayText += `\n\n---\n**PR created:** [${data.pr_url}](${data.pr_url})`;
        }

        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
            loading.innerHTML = DOMPurify.sanitize(marked.parse(displayText));
        } else {
            loading.textContent = displayText;
        }

    }

    catch(err){
        console.error("Fetch Error:", err);
        loading.textContent="Error contacting backend.";
    }

}

</script>

</body>
</html>
